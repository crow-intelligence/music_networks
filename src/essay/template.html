function rDiachronic(host, config) {
  // Cumulative meaning-drift lines for the target words; highlight one (e.g. szabadság).
  const u = DATA.usage || {};
  const labels = (u.decades || []).map(decadeLabel);
  const drift = u.cumulative_drift || [];
  return { setState(st) {
    const hi = [].concat(st.highlight || config.highlight || []);
    const lines = drift.map(w => ({
      name: w.word, values: w.drift,
      color: hi.includes(w.word) ? PALETTE[4] : undefined,  // "lila" emphasis
    }));
    lines.sort((a, b) => (hi.includes(b.name) ? 1 : 0) - (hi.includes(a.name) ? 1 : 0));
    host.innerHTML = "";
    const chart = document.createElement("div"); chart.id = host.id + "-chart";
    const leg = document.createElement("div"); leg.id = host.id + "-leg"; leg.className = "legend";
    host.append(chart, leg);
    multiLine(chart.id, leg.id, labels, lines,
      {yUnit: "kumulatív jelentés-eltolódás", fmt: v => (+v).toFixed(1),
       emphasize: Math.max(hi.length, 1), emphasizeFirst: true, fadeColor: true, legendBelow: true});
  }};
}
function rEmotion(host, config) {
  const ed = DATA.emotion || {}; const cats = emoCats(ed.labels);
  const rows = (ed.by_decade || []).map(d => ({decade: d.decade, n: d.n, share: d.share, low_n: d.n < 50}));
  return { setState() {
    host.innerHTML = ""; const c = document.createElement("div"); c.id = host.id + "-chart"; host.appendChild(c);
    stackedBars(c.id, rows, cats, {overall: ed.overall, ariaLabel: "Érzelmek megoszlása évtizedenként."});
  }};
}
function rMattr(host, config) {
  // Lexical diversity (MATTR) over the decades — one line.
  const u = DATA.usage || {};
  const rows = (u.vocab_stats || []).filter(v => v.lexdiv != null)
    .slice().sort((a, b) => a.decade - b.decade);
  return { setState() {
    host.innerHTML = "";
    const chart = document.createElement("div"); chart.id = host.id + "-chart";
    const leg = document.createElement("div"); leg.id = host.id + "-leg"; leg.className = "legend";
    host.append(chart, leg);
    const lines = [{name: "Szókincs változatossága (MATTR)", color: cssVar("--c2"),
      values: rows.map(r => r.lexdiv)}];
    multiLine(chart.id, leg.id, rows.map(r => decadeLabel(r.decade)), lines,
      {yUnit: "MATTR", fmt: v => (+v).toFixed(3), legendBelow: true});
  }};
}
function rNetwork(host, config) {
  const graphs = (DATA.networks || {}).graphs || {};
  return { setState(st) {
    const g = graphs[String(st.decade || config.decade)]; host.innerHTML = "";
    if (!g) { empty(host.id, "Nincs adat."); return; }
    const seed = st.seed || config.seed || (g.seeds || [])[0];
    host.appendChild(egoSVG(g, seed, st.count || config.count || 10));
  }};
}
const RENDERERS = {"topics-line": rTopics, "emotion-stack": rEmotion,
  "network-ego": rNetwork, "diachronic-line": rDiachronic, "mattr-line": rMattr};

// ---- wire each scrolly scene + the scroll engine ----
(function () {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("section.scrolly").forEach(sec => {
    const si = +sec.dataset.scene; const scene = SCENES[si]; if (!scene) return;
    const host = sec.querySelector(".figure");
    const make = RENDERERS[scene.config.figure]; if (!make || !host) return;
    const inst = make(host, scene.config); sec._inst = inst; sec._last = -1;
    const first = (scene.steps[0] && scene.steps[0].state) || {};
    inst.setState(first);
  });
  if (reduce) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const si = +e.target.dataset.scene, ti = +e.target.dataset.step;
      const sec = document.querySelector('section.scrolly[data-scene="' + si + '"]');
      if (!sec || !sec._inst || sec._last === ti) return;
      sec._last = ti;
      sec._inst.setState((SCENES[si].steps[ti] && SCENES[si].steps[ti].state) || {});
      sec.querySelectorAll(".step").forEach(s => s.classList.toggle("step-active", +s.dataset.step === ti));
      const cap = sec.querySelector(".fig-cap");
      if (cap) cap.textContent = (ti + 1) + " / " + SCENES[si].steps.length;
    });
  }, {rootMargin: "-42% 0px -42% 0px", threshold: 0});
  document.querySelectorAll("section.scrolly .step").forEach(st => io.observe(st));
})();
</script>
