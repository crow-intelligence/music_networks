const SCENES = /*__SCENES__*/;

// ── shared vanilla-SVG chart helpers, inlined verbatim from the dashboard
//    template (stackedBars, multiLine, egoSVG, barList, catStyle, bindTip, …).
//    They read the chart CSS tokens (dark values) defined in :root above. ──
/*__CHARTS__*/

// ── per-decade era chart: dispatched once per scene from cfg.chart. ──
function chartFor(host, cfg, decade) {
  const chart = String(cfg.chart || "");
  host.innerHTML = "";
  const id = host.id;
  const empty = (msg) => { host.innerHTML = '<p class="kwic-empty">' + msg + "</p>"; };
  const twoHosts = () => {
    host.innerHTML = '<div id="' + id + '-svg"></div>'
      + '<div id="' + id + '-lg" class="legend"></div>';
  };
  try {
    if (chart === "emotion") {
      const ed = DATA.emotion || {};
      if (!(ed.by_decade || []).length) return empty("Nincs érzelmi adat.");
      const cats = [
        { key: "joy", label: "öröm", color: "#e8c97e" },
        { key: "sadness", label: "szomorúság", color: "#6fb4ff" },
        { key: "anger", label: "harag", color: "#f0876a" },
        { key: "fear", label: "félelem", color: "#b79cff" },
      ];
      const rows = ed.by_decade.map(d => ({
        decade: d.decade, n: d.n, share: d.share, low_n: d.n < 50 }));
      stackedBars(id, rows, cats, { overall: ed.overall, rotateX: true,
        ariaLabel: "Érzelmi megoszlás évtizedenként." });
    } else if (chart === "mattr") {
      const rows = ((DATA.usage || {}).vocab_stats || [])
        .filter(v => v.lexdiv != null)
        .map(v => ({ label: decadeLabel(v.decade), value: v.lexdiv }));
      if (!rows.length) return empty("Nincs szókincsadat.");
      barList(host, rows, { fmt: v => v.toFixed(3) });
    } else if (chart === "topics" || chart.indexOf("topics-spot") === 0) {
      const t = DATA.topics || {};
      const info = t.info || [], ot = t.over_time || [];
      if (!info.length || !ot.length) return empty("Nincs témaadat.");
      const byTopic = {}, decSet = new Set(), decTotal = {};
      ot.forEach(r => {
        (byTopic[r.topic_id] = byTopic[r.topic_id] || {})[r.decade] = r.frequency;
        decSet.add(r.decade);
        decTotal[r.decade] = (decTotal[r.decade] || 0) + r.frequency;
      });
      const decs = [...decSet].sort((a, b) => a - b);
      const nameOf = {}, sizeOf = {};
      info.forEach(t2 => { nameOf[t2.topic_id] = t2.name; sizeOf[t2.topic_id] = t2.size; });
      const ids = info.map(t2 => t2.topic_id);
      const m = chart.match(/topics-spot:(-?\d+)/);
      const spot = m ? +m[1] : null;
      const ordered = spot != null
        ? [spot, ...ids.filter(i => i !== spot)]
        : [...ids].sort((a, b) => (sizeOf[b] || 0) - (sizeOf[a] || 0));
      const lineFor = tid => ({
        name: nameOf[tid] || ("#" + tid),
        values: decs.map(d => { const f = (byTopic[tid] || {})[d] || 0;
          return decTotal[d] ? f / decTotal[d] : 0; }),
      });
      const lines = ordered.map((tid, i) => {
        const st = catStyle(i);
        return { ...lineFor(tid), color: st.color, dash: DASH_VARIANTS[st.variant] };
      });
      twoHosts();
      multiLine(id + "-svg", id + "-lg", decs.map(decadeLabel), lines, {
        emphasize: spot != null ? 1 : 4, emphasizeFirst: true, fadeColor: true,
        legendBelow: true, yUnit: "témaarány", fmt: v => (v * 100).toFixed(1) + "%" });
      // 29-topic legend is too tall for the pinned panel — the spotlit line is
      // labelled at its end + identifiable on hover.
      const lg = document.getElementById(id + "-lg");
      if (lg) lg.style.display = "none";
    } else if (chart.indexOf("semantic") === 0) {
      const u = DATA.usage || {}, word = chart.split(":")[1];
      const rows = u.cumulative_drift || [];
      if (!rows.length) return empty("Nincs jelentésváltozási adat.");
      const ordered = [...rows].sort((a, b) =>
        (a.word === word ? -1 : b.word === word ? 1 : 0));
      const accent = cssVar("--accent", "#e8c97e");
      const lines = ordered.map((w, i) => {
        const st = catStyle(i);
        return { name: w.word, values: w.drift,
          color: w.word === word ? accent : st.color, dash: DASH_VARIANTS[st.variant] };
      });
      twoHosts();
      multiLine(id + "-svg", id + "-lg", (u.decades || []).map(decadeLabel), lines, {
        emphasize: 1, emphasizeFirst: true, fadeColor: true, legendBelow: true,
        yUnit: "kumulatív jelentés-eltérés" });
      // 12-word legend caused a scrollbar; the spotlit word is end-labelled.
      const lg = document.getElementById(id + "-lg");
      if (lg) lg.style.display = "none";
    } else if (chart.indexOf("ego") === 0) {
      const seed = chart.split(":")[1];
      const g = ((DATA.networks || {}).graphs || {})[String(decade)];
      if (g && g.adj && g.adj[seed]) {
        const fig = document.createElement("div"); fig.className = "ego-fig";
        fig.appendChild(egoSVG(g, seed, 8));
        host.appendChild(fig);
        const cap = document.createElement("p"); cap.className = "chart-cap";
        cap.textContent = "„" + seed + "” szóhálója — a leggyakoribb szomszédok";
        host.appendChild(cap);
      } else { empty("Nincs hálózati adat erre a szóra."); }
    }
  } catch (err) { empty("A diagram nem rajzolható."); }
}

// ── KWIC concordance renderer: the pinned decade graphic. setState({word})
//    renders that word's real lyric lines for the scene's decade. ──
function kwicFigure(host, config) {
  const decade = String(config.decade);
  const kwic = DATA.kwic || {};
  return { setState(state) {
    const word = state.word;
    host.innerHTML = "";
    const head = document.createElement("p");
    head.className = "kwic-word";
    head.innerHTML = "a korszak dalaiban: <b>„" + (word || "") + "”</b>";
    host.appendChild(head);
    const lines = ((kwic[word] || {})[decade]) || [];
    if (!lines.length) {
      const e = document.createElement("p"); e.className = "kwic-empty";
      e.textContent = "Ebben az évtizedben nincs találat erre a szóra.";
      host.appendChild(e); return;
    }
    lines.slice(0, 4).forEach((c, i) => {
      const row = document.createElement("div"); row.className = "kw-row";
      row.style.animationDelay = (i * 0.07) + "s";
      const pre = document.createElement("span"); pre.className = "kw-pre"; pre.textContent = c.pre;
      const kw = document.createElement("span"); kw.className = "kw-kw"; kw.textContent = c.kw;
      const post = document.createElement("span"); post.className = "kw-post"; post.textContent = c.post;
      row.append(pre, kw, post);
      host.appendChild(row);
    });
  }};
}

// ── Diachronic KWIC (overview): one real line per decade for a single word. ──
const DECADE_SUFFIX = {1950:"es",1960:"as",1970:"es",1980:"as",1990:"es",2000:"es",2010:"es",2020:"as"};
function renderDiaKwic() {
  document.querySelectorAll(".dia-kwic").forEach(host => {
    const word = host.dataset.word;
    const byDec = (DATA.kwic || {})[word] || {};
    const decs = Object.keys(byDec).map(Number).filter(d => d >= 1950).sort((a, b) => a - b);
    host.innerHTML = "";
    decs.forEach(d => {
      const lines = byDec[String(d)] || [];
      if (!lines.length) return;
      const c = lines[0];
      const row = document.createElement("div"); row.className = "dia-row";
      const dec = document.createElement("div"); dec.className = "dia-dec";
      dec.textContent = d + "-" + (DECADE_SUFFIX[d] || "es");
      const line = document.createElement("div"); line.className = "dia-line";
      line.append(document.createTextNode(c.pre + " "));
      const b = document.createElement("b"); b.textContent = c.kw; line.appendChild(b);
      line.append(document.createTextNode(" " + c.post));
      row.append(dec, line);
      host.appendChild(row);
    });
  });
}

// ── Vektortér: each key word's Procrustes-aligned vector traced across the
//    decades in one 2D plane — the *direction* of its meaning-drift (approximate;
//    see note). Movers are highlighted, others faded. ──
function renderVectorspace() {
  const host = document.getElementById("vspace");
  const vs = DATA.vectorspace || {};
  if (!host || !(vs.words || []).length) {
    if (host) host.innerHTML = '<p class="kwic-empty">Nincs vektortér-adat.</p>';
    return;
  }
  const W = 1000, H = 620, pad = 54, pw = W - 2 * pad, ph = H - 2 * pad;
  const sx = x => pad + x * pw, sy = y => pad + (1 - y) * ph;
  const movers = new Set(vs.top_movers || []);
  const ctx = cssVar("--ctx", "#55525a");
  const pal = (typeof PALETTE !== "undefined" && PALETTE.length) ? PALETTE
    : ["#e8c97e", "#5ec8c8", "#f0876a", "#8fd06a", "#b79cff", "#f0b429"];
  const svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
  // faded words first, movers (highlighted) on top
  const words = [...vs.words].sort(
    (a, b) => (movers.has(a.word) ? 1 : 0) - (movers.has(b.word) ? 1 : 0));
  let ci = 0;
  words.forEach(w => {
    const isM = movers.has(w.word);
    const color = isM ? pal[ci++ % pal.length] : ctx;
    const pts = w.path.map(p => [sx(p.x), sy(p.y)]);
    if (pts.length > 1) {
      svg.appendChild(s("polyline", {
        points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: color,
        "stroke-width": isM ? 2.4 : 1, "stroke-linecap": "round",
        "stroke-linejoin": "round", opacity: isM ? 0.95 : 0.32 }));
    }
    w.path.forEach((p, i) => {
      const t = w.path.length > 1 ? i / (w.path.length - 1) : 1;  // early faint → late bold
      const dot = s("circle", { cx: sx(p.x), cy: sy(p.y), r: isM ? 4.2 : 2.4,
        fill: color, opacity: (isM ? 0.4 : 0.25) + (isM ? 0.6 : 0.3) * t });
      bindTip(dot, "<b>" + w.word + "</b> · " + p.decade);
      svg.appendChild(dot);
    });
    if (isM && pts.length) {
      const last = pts[pts.length - 1];
      const lbl = s("text", { x: last[0] + 9, y: last[1] + 5, class: "vs-label",
        fill: color, "font-size": 22 });
      lbl.textContent = w.word;
      svg.appendChild(lbl);
    }
  });
  host.innerHTML = "";
  host.appendChild(svg);
}

// ── Scroll engine: each scrolly graphic morphs chart→KWIC across its steps. ──
(function () {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  renderDiaKwic();
  renderVectorspace();
  // standalone charts inside reveal sections (e.g. the opening semantic-drift chart)
  document.querySelectorAll(".reveal .era-chart[data-chart]").forEach(host => {
    const sec = host.closest("[data-scene]");
    const si = sec ? +sec.dataset.scene : -1;
    const cfg = (SCENES[si] && SCENES[si].config) || {};
    chartFor(host, { chart: host.dataset.chart, decade: cfg.decade }, cfg.decade);
  });

  function show(el) {
    if (!el) return;
    el.style.display = "";
    el.classList.remove("show-fade"); void el.offsetWidth; el.classList.add("show-fade");
  }
  function applyState(sec, state) {
    const isChart = !!(state && state.chart);
    if (sec._chartHost) sec._chartHost.style.display = isChart ? "" : "none";
    if (sec._kwicHost) sec._kwicHost.style.display = isChart ? "none" : "";
    if (isChart) { show(sec._chartHost); }
    else if (sec._kwic && state && state.word) { sec._kwic.setState({ word: state.word }); show(sec._kwicHost); }
  }

  document.querySelectorAll("section.scrolly").forEach(sec => {
    const si = +sec.dataset.scene; const scene = SCENES[si]; if (!scene) return;
    sec._kwicHost = sec.querySelector(".kwic-figure");
    sec._chartHost = sec.querySelector(".era-chart");
    sec._kwic = sec._kwicHost ? kwicFigure(sec._kwicHost, scene.config) : null;
    if (sec._chartHost && scene.config.chart) chartFor(sec._chartHost, scene.config, scene.config.decade);
    sec._last = -1;
    if (reduce) {
      // no pinning/stepping: show the chart AND the first keyword's concordance
      if (sec._chartHost) sec._chartHost.style.display = "";
      const fw = (scene.steps.find(s => s.state && s.state.word) || {}).state;
      if (sec._kwic && fw) sec._kwic.setState({ word: fw.word });
      if (sec._kwicHost) sec._kwicHost.style.display = "";
    } else {
      applyState(sec, (scene.steps[0] && scene.steps[0].state) || {});
    }
  });

  // reveal fade-in for narrow sections
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("is-visible"); rio.unobserve(e.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => rio.observe(el));
  if (reduce) { document.querySelectorAll(".reveal").forEach(el => el.classList.add("is-visible")); return; }

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const si = +e.target.dataset.scene, ti = +e.target.dataset.step;
      const sec = document.querySelector('section.scrolly[data-scene="' + si + '"]');
      if (!sec || sec._last === ti) return;
      sec._last = ti;
      applyState(sec, (SCENES[si].steps[ti] && SCENES[si].steps[ti].state) || {});
      sec.querySelectorAll(".step").forEach(s => s.classList.toggle("step-active", +s.dataset.step === ti));
    });
  }, { rootMargin: "-45% 0px -45% 0px", threshold: 0 });
  document.querySelectorAll("section.scrolly .step").forEach(st => io.observe(st));
})();

// nav toggle
(function () {
  const t = document.querySelector(".nav-toggle"), n = document.querySelector(".brand-nav");
  if (!t || !n) return;
  t.addEventListener("click", () => {
    const open = n.classList.toggle("open");
    t.setAttribute("aria-expanded", open ? "true" : "false");
  });
})();
</script>
